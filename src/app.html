<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { color-scheme:light; --bg:#fff; --fg:#242424; --muted:#676767; --border:#ddd; --secondary:#f4f4f5; }
:root.dark { color-scheme:dark; --bg:#18181b; --fg:#eee; --muted:#aaa; --border:#444; --secondary:#27272a; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; color:var(--fg); background:var(--bg); font:14px/1.5 var(--font,sans-serif); }
#title { margin:0 0 8px; font-weight:500; overflow-wrap:anywhere; }
#surface { position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
#controls { position:absolute; right:4px; top:4px; display:flex; gap:4px; z-index:2; }
button { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:6px; color:inherit; background:var(--bg); padding:6px; cursor:pointer; font:inherit; }
button:hover { background:var(--secondary); } button:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
#download-menu { position:absolute; top:36px; right:0; padding:4px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
#viewport { overflow:auto; height:500px; display:flex; align-items:safe center; justify-content:safe center; touch-action:none; }
#canvas { position:relative; flex-shrink:0; } #diagram { position:absolute; top:0; left:0; transform-origin:top left; } #diagram svg { display:block; max-width:none !important; }
#status { position:absolute; inset:52px 16px 16px; margin:0; color:var(--muted); white-space:pre-wrap; overflow:auto; overflow-wrap:anywhere; display:flex; align-items:center; pointer-events:none; }
#status[data-state="failed"] { color:var(--fg); font:13px/1.45 ui-monospace,monospace; }
#editor { margin-top:8px; } summary { cursor:pointer; color:var(--muted); font-size:12px; }
label { display:block; margin:8px 0; } textarea { width:100%; height:112px; padding:8px; resize:vertical; border:1px solid var(--border); border-radius:6px; color:inherit; background:var(--bg); font:12px ui-monospace,monospace; }
#editor-actions { display:flex; gap:8px; } #editor-actions button { border:1px solid var(--border); padding:4px 10px; font-size:12px; }
html[data-display-mode="fullscreen"] body { height:100dvh; display:flex; flex-direction:column; }
html[data-display-mode="fullscreen"] #surface { flex:1; min-height:120px; display:flex; }
html[data-display-mode="fullscreen"] #viewport { width:100%; height:auto; flex:1; }
</style></head><body>
<figcaption id="title" hidden></figcaption>
<div id="surface"><div id="controls"><button id="fit" data-label="fit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><rect width="10" height="8" x="7" y="8" rx="1" /></svg></button><button id="plus" data-label="plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></svg></button><button id="minus" data-label="minus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="8" x2="14" y1="11" y2="11" /></svg></button><button id="expand" data-label="expand"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 15 6 6" /><path d="m15 9 6-6" /><path d="M21 16v5h-5" /><path d="M21 8V3h-5" /><path d="M3 16v5h5" /><path d="m3 21 6-6" /><path d="M3 8V3h5" /><path d="M9 9 3 3" /></svg></button><button id="copy" data-label="copy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg></button><button id="download" data-label="download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></svg></button><div id="download-menu" hidden><button id="download-png">PNG</button><button id="download-svg">SVG</button></div></div>
<p id="status" role="status"></p><div id="viewport"><div id="canvas"><div id="diagram"></div></div></div></div>
<details id="editor"><summary data-i18n="edit"></summary><label for="source" data-i18n="source"></label><textarea id="source" spellcheck="false" maxlength="100000"></textarea>
<div id="editor-actions"><button id="render" data-i18n="render"></button><button id="reset" data-i18n="reset"></button><button id="repair" data-i18n="repair" hidden></button></div></details>

</body></html>
